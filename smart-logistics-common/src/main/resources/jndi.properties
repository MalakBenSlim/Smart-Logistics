# Configuration JNDI centralisee pour la decouverte des services distribues
java.naming.factory.initial=com.sun.jndi.rmi.registry.RegistryContextFactory
java.naming.provider.url=rmi://localhost:1099

# Configuration ActiveMQ JNDI
jms.factory.initial=org.apache.activemq.jndi.ActiveMQInitialContextFactory
jms.broker.url=tcp://localhost:61616
jms.topic.orders=smartlogistics.events.orders
jms.topic.delivery=smartlogistics.events.delivery
jms.queue.stockAlerts=smartlogistics.alerts.stock

# Serveurs socket et base de donnees
tcp.server.host=localhost
tcp.server.port=9095
