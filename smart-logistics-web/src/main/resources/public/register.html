<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription Client — Smart Logistics</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="auth-form-panel" style="min-height:100vh;">
  <div class="auth-card" style="max-width:520px;">
    <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.75rem;font-weight:700;font-size:1.15rem;">
      <span>🚚</span> Smart Logistics
    </div>
    <h2 style="font-size:1.35rem;margin-bottom:.25rem;">Créer un compte Client</h2>
    <p style="color:var(--text-muted);font-size:.86rem;margin-bottom:1.15rem;">Votre mot de passe sera haché avec BCrypt côté serveur.</p>

    <div id="reg-alert"></div>

    <form id="reg-form">
      <div class="form-group">
        <label class="form-label">Nom complet</label>
        <input class="form-control" id="fullName" required placeholder="Ex: Sarra Ben Salem">
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-control" id="email" type="email" required placeholder="sarra@exemple.tn">
        </div>
        <div class="form-group">
          <label class="form-label">Téléphone</label>
          <input class="form-control" id="phone" required placeholder="+216 55 123 456">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe (min. 6 caractères)</label>
        <input class="form-control" id="password" type="password" minlength="6" required>
      </div>
      <div class="form-group">
        <label class="form-label">Ville / Zone (remplit les coordonnées GPS)</label>
        <select class="form-control" id="cityPreset" onchange="applyCity()">
          <option value="36.8065,10.1815,Centre Ville, Tunis">Tunis Centre (36.8065, 10.1815)</option>
          <option value="34.7406,10.7603,Avenue Majida Boulila, Sfax">Sfax (34.7406, 10.7603)</option>
          <option value="35.8256,10.6369,Sahloul, Sousse">Sousse (35.8256, 10.6369)</option>
          <option value="33.8815,10.0982,Centre Ville, Gabès">Gabès (33.8815, 10.0982)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Adresse de livraison</label>
        <input class="form-control" id="address" required value="Centre Ville, Tunis">
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Latitude</label>
          <input class="form-control" id="lat" type="number" step="0.0001" required value="36.8065">
        </div>
        <div class="form-group">
          <label class="form-label">Longitude</label>
          <input class="form-control" id="lng" type="number" step="0.0001" required value="10.1815">
        </div>
      </div>
      <button class="btn btn-primary" style="width:100%;padding:.72rem;" type="submit">Créer mon compte</button>
    </form>
    <div style="text-align:center;margin-top:1rem;font-size:.86rem;">
      Déjà inscrit ? <a href="/login">Se connecter</a>
    </div>
  </div>
</div>
<script src="/js/common.js"></script>
<script>
  function applyCity() {
    const [lat, lng, ...addr] = document.getElementById('cityPreset').value.split(',');
    document.getElementById('lat').value = lat;
    document.getElementById('lng').value = lng;
    document.getElementById('address').value = addr.join(',');
  }
  document.getElementById('reg-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const box = document.getElementById('reg-alert');
    box.innerHTML = '';
    try {
      await SL.apiFetch('/api/auth/register', {
        method: 'POST',
        body: JSON.stringify({
          fullName: document.getElementById('fullName').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          rawPassword: document.getElementById('password').value,
          address: document.getElementById('address').value,
          latitude: parseFloat(document.getElementById('lat').value),
          longitude: parseFloat(document.getElementById('lng').value)
        })
      });
      box.innerHTML = '<div class="alert alert-success">Compte créé avec succès ! Redirection vers la connexion...</div>';
      setTimeout(() => window.location.href = '/login', 1300);
    } catch (err) {
      box.innerHTML = `<div class="alert alert-error">${SL.escapeHtml(err.message)}</div>`;
    }
  });
</script>
</body>
</html>
