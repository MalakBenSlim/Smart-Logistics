<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié — Smart Logistics</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="auth-form-panel" style="min-height:100vh;">
  <div class="auth-card">
    <h2 style="font-size:1.35rem;margin-bottom:.25rem;">Réinitialisation du mot de passe</h2>
    <p style="color:var(--text-muted);font-size:.86rem;margin-bottom:1.25rem;">Simulation académique avec jeton temporaire généré côté serveur RMI.</p>
    <div id="fp-alert"></div>

    <form id="step1-form">
      <div class="form-group">
        <label class="form-label">Email du compte</label>
        <input class="form-control" id="fp-email" type="email" required placeholder="client@smartlogistics.tn">
      </div>
      <button class="btn btn-primary" style="width:100%;" type="submit">Demander un jeton</button>
    </form>

    <form id="step2-form" style="display:none;margin-top:1rem;">
      <div class="form-group">
        <label class="form-label">Jeton reçu</label>
        <input class="form-control" id="fp-token" required>
      </div>
      <div class="form-group">
        <label class="form-label">Nouveau mot de passe (min. 6 caractères)</label>
        <input class="form-control" id="fp-newpass" type="password" minlength="6" required>
      </div>
      <button class="btn btn-success" style="width:100%;" type="submit">Confirmer le nouveau mot de passe</button>
    </form>

    <div style="text-align:center;margin-top:1.1rem;font-size:.86rem;">
      <a href="/login">← Retour à la connexion</a>
    </div>
  </div>
</div>
<script src="/js/common.js"></script>
<script>
  document.getElementById('step1-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const box = document.getElementById('fp-alert');
    try {
      const res = await SL.apiFetch('/api/auth/forgot-password', {
        method: 'POST',
        body: JSON.stringify({ email: document.getElementById('fp-email').value })
      });
      box.innerHTML = `<div class="alert alert-success">${SL.escapeHtml(res.message)}<br><strong>Jeton simulé :</strong> <code>${SL.escapeHtml(res.simulatedResetToken)}</code></div>`;
      document.getElementById('fp-token').value = res.simulatedResetToken;
      document.getElementById('step2-form').style.display = 'block';
    } catch (err) {
      box.innerHTML = `<div class="alert alert-error">${SL.escapeHtml(err.message)}</div>`;
    }
  });

  document.getElementById('step2-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const box = document.getElementById('fp-alert');
    try {
      const res = await SL.apiFetch('/api/auth/reset-password', {
        method: 'POST',
        body: JSON.stringify({
          token: document.getElementById('fp-token').value,
          newPassword: document.getElementById('fp-newpass').value
        })
      });
      box.innerHTML = `<div class="alert alert-success">${SL.escapeHtml(res.message)}</div>`;
      setTimeout(() => window.location.href = '/login', 1300);
    } catch (err) {
      box.innerHTML = `<div class="alert alert-error">${SL.escapeHtml(err.message)}</div>`;
    }
  });
</script>
</body>
</html>
